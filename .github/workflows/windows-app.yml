name: Windows app

# Builds the .exe and publishes it to the "windows-latest" release, so the download links never change:
#   .../releases/download/windows-latest/JAK-flowTracker-Setup.exe
#   .../releases/download/windows-latest/JAK-flowTracker-portable.exe
on:
  workflow_dispatch:
  push:
    branches: [main, claude/nice-ride-1n4qul]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Package .exe
        working-directory: desktop
        shell: bash
        run: |
          npm install --no-audit --no-fund
          rm -rf app && cp -r ../dist app
          npx electron-builder --win --x64
          mkdir -p ../out
          cp release/JAK-flowTracker-Setup-*.exe ../out/JAK-flowTracker-Setup.exe
          cp release/JAK-flowTracker-*-portable.exe ../out/JAK-flowTracker-portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: JAK-flowTracker-windows
          path: out/*.exe
      - name: Publish download links
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-latest >/dev/null 2>&1 || gh release create windows-latest \
            --title "JAK - flowTracker for Windows" --prerelease --target "$GITHUB_SHA" \
            --notes "Latest Windows build. JAK-flowTracker-Setup.exe installs the app; JAK-flowTracker-portable.exe runs without installing."
          gh release upload windows-latest out/JAK-flowTracker-Setup.exe out/JAK-flowTracker-portable.exe --clobber
